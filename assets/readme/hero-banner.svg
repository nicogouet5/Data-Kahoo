<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">DATA-KAHOO // ARENA_OS — Simulador Táctico de Visualización &amp; Storytelling</title>
  <desc id="hero-desc">Videojuego educativo para ayudantías de Data Analysis: auditoría de variables, duelos de código Matplotlib fig, ax y narrativa de datos.</desc>

  <defs>
    <!-- Grid pattern -->
    <pattern id="coord-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2e25" stroke-width="0.8" opacity="0.45"/>
      <circle cx="0" cy="0" r="1.5" fill="#34f576" opacity="0.25"/>
    </pattern>

    <linearGradient id="bar-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34f576"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="term-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#131e18"/>
      <stop offset="100%" stop-color="#1a2b22"/>
    </linearGradient>
  </defs>

  <!-- Canvas background -->
  <rect width="1200" height="380" rx="16" fill="#070b09" stroke="#1d2e25" stroke-width="2"/>
  <rect width="1200" height="380" rx="16" fill="url(#coord-grid)"/>

  <!-- Left Column: Title & Mission Brief -->
  <g id="title-block" transform="translate(56, 42)">
    <!-- Terminal path indicator -->
    <g transform="translate(0, 0)">
      <rect width="320" height="26" rx="4" fill="#131e18" stroke="#365746" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#34f576"/>
      <text x="26" y="17" fill="#34f576" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1">TTY://DATAVIZ_ARENA_OS · v10.4</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="66" fill="#e8f5ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Chakra Petch', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      DATA-KAHOO <tspan fill="#34f576">//</tspan> ARENA_OS
    </text>

    <!-- Subtitle -->
    <text x="0" y="100" fill="#34f576" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">
      Del Dato Crudo al Storytelling Ejecutivo con Matplotlib
    </text>

    <!-- Description Lines -->
    <text x="0" y="132" fill="#b4cbbe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" line-height="1.5">
      Videojuego interactivo para la Ayudantía Clase 10 HBDA (Data Analysis).
    </text>
    <text x="0" y="154" fill="#b4cbbe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" line-height="1.5">
      Audita DataFrames reales, resuelve duelos <tspan fill="#e8f5ee" font-family="monospace">fig, ax</tspan> con Rayos X
    </text>
    <text x="0" y="176" fill="#b4cbbe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" line-height="1.5">
      y formula titulares autónomos accionables para toma de decisiones.
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 220)">
      <!-- Badge 1: Live Demo -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="4" fill="#22e566"/>
        <circle cx="16" cy="17" r="4" fill="#05140a"/>
        <text x="28" y="22" fill="#05140a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="800">EN VIVO GITHUB PAGES</text>
      </g>

      <!-- Badge 2: Clase 10 -->
      <g transform="translate(192, 0)">
        <rect width="168" height="34" rx="4" fill="#131e18" stroke="#365746" stroke-width="1"/>
        <text x="14" y="22" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">CLASE 10 HBDA · PYTHON</text>
      </g>

      <!-- Badge 3: Torneo -->
      <g transform="translate(372, 0)">
        <rect width="160" height="34" rx="4" fill="#131e18" stroke="#365746" stroke-width="1"/>
        <text x="14" y="22" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">TORNEO POR EQUIPOS</text>
      </g>
    </g>

    <!-- Key Shortcuts indicator -->
    <text x="0" y="284" fill="#7c9989" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      ATAJOS DE SALA: [R] RULETA · [G] GUÍA CLASE 10 · [A/B] DUELOS · [ENTER] BOOT
    </text>
  </g>

  <!-- Right Column: Interactive Console & Telemetry Mockup -->
  <g id="telemetry-screen" transform="translate(680, 42)">
    <!-- Terminal Box Frame -->
    <rect width="464" height="296" rx="10" fill="#0b120e" stroke="#365746" stroke-width="1.5"/>

    <!-- Terminal Title Bar -->
    <rect width="464" height="34" rx="10" fill="url(#term-header)"/>
    <rect y="24" width="464" height="10" fill="url(#term-header)"/>
    <line x1="0" y1="34" x2="464" y2="34" stroke="#1d2e25" stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="20" cy="17" r="4.5" fill="#f87171"/>
    <circle cx="36" cy="17" r="4.5" fill="#fbbf24"/>
    <circle cx="52" cy="17" r="4.5" fill="#34f576"/>
    <text x="72" y="21" fill="#7c9989" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">bash · fig, ax = plt.subplots(figsize=(10, 4))</text>

    <!-- Inner Terminal Content -->
    <!-- ASCII Mini Banner -->
    <g transform="translate(20, 52)">
      <text fill="#34f576" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">
        <tspan x="0" y="0">╔═════════════════════════════════════════════╗</tspan>
        <tspan x="0" y="14">║  [OK] PANDAS .dtypes AUDIT ................ ║</tspan>
        <tspan x="0" y="28">║  [OK] AXES (ax) SELECTION ENGINE .......... ║</tspan>
        <tspan x="0" y="42">║  [OK] X-RAY: FIGURE vs AXES COMPONENT ..... ║</tspan>
        <tspan x="0" y="56">╚═════════════════════════════════════════════╝</tspan>
      </text>
    </g>

    <!-- Matplotlib Live Plot Frame Mockup -->
    <g transform="translate(20, 134)">
      <!-- Figure outer box (dashed in X-ray) -->
      <rect width="424" height="106" rx="4" fill="#080e0a" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="8" y="14" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">Figure (fig) [Lienzo exterior]</text>

      <!-- Axes inner plot area -->
      <rect x="52" y="20" width="358" height="72" fill="#0d1812" stroke="#365746" stroke-width="1"/>
      <text x="58" y="32" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9">ax.bar(df['item'], df['val']) · ylim(0, 100)</text>

      <!-- Axes bars -->
      <rect x="80" y="42" width="28" height="50" rx="2" fill="url(#bar-gradient)"/>
      <rect x="135" y="56" width="28" height="36" rx="2" fill="#365746"/>
      <rect x="190" y="48" width="28" height="44" rx="2" fill="#365746"/>
      <rect x="245" y="62" width="28" height="30" rx="2" fill="#365746"/>
      <rect x="300" y="70" width="28" height="22" rx="2" fill="#365746"/>

      <!-- Accent label pointing to top bar -->
      <text x="74" y="38" fill="#34f576" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700">★ ACENTO</text>

      <!-- Axis lines -->
      <line x1="52" y1="92" x2="410" y2="92" stroke="#7c9989" stroke-width="1"/>
      <line x1="52" y1="20" x2="52" y2="92" stroke="#7c9989" stroke-width="1"/>
    </g>

    <!-- Prompt status line at bottom -->
    <g transform="translate(20, 268)">
      <text fill="#34f576" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">
        root@dataviz-arena:~$ <tspan fill="#e8f5ee">ax.set_title("Líder de Categoría")</tspan> <tspan fill="#34f576">█</tspan>
      </text>
    </g>
  </g>
</svg>
